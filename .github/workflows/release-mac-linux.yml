# Builds the macOS and Linux packages for each published release and attaches them to it.
# The Windows installer is built and published locally with `npm run release`; publishing the
# release is what starts this workflow. It can also be run by hand for an existing tag.
name: macOS and Linux builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to (v1.2.0), or a branch to only test the build (main)
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            script: dist:mac
          - os: ubuntu-22.04
            script: dist:linux
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run ${{ matrix.script }}
        env:
          # No Apple Developer certificate: the app is ad-hoc signed (see package.json).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Starts the packaged app and asks its debug connection for its state; fails if it doesn't start.
      - name: Smoke test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
            app=$(ls release/*.AppImage | head -1); chmod +x "$app"
            APPIMAGE_EXTRACT_AND_RUN=1 RD_BRIDGE=1 xvfb-run -a "$app" --no-sandbox > app.log 2>&1 &
          else
            RD_BRIDGE=1 release/mac-arm64/RimDeck.app/Contents/MacOS/RimDeck > app.log 2>&1 &
          fi
          for i in $(seq 1 45); do
            if curl -sf -X POST -d '[]' http://127.0.0.1:5199/api/getState -o state.json; then break; fi
            sleep 2
          done
          node -e "const s=require('./state.json'); if (!s.ok) { console.error(s.error); process.exit(1) } console.log('RimDeck started; platform paths:', JSON.stringify(s.result.settings.paths))" || { cat app.log; exit 1; }

      # Kept for a week either way, so a test run (started by hand with a branch name) can be tried out.
      - uses: actions/upload-artifact@v4
        with:
          name: rimdeck-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.AppImage
            release/*.deb
          retention-days: 7

      - name: Attach to the release
        if: startsWith(env.TAG, 'v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release/*.dmg release/*.zip release/*.AppImage release/*.deb release/*.blockmap release/latest-*.yml)
          ls -la "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber
